# cargo-deny: `make deny` locally, and the `deny` job in CI (both pass --config).

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  # rustls and its crypto/trust-store dependencies (ring, webpki, subtle,
  # untrusted, webpki-roots), all permissive.
  "ISC",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
