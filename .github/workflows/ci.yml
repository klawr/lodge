name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only by default; the release jobs opt into write access individually.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # The oldest Rust this crate promises to build with (`rust-version` in
  # Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets

  # Licenses, security advisories and dependency sources (.github/deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: --config .github/deny.toml

  # The static release binaries, built on every push and PR so a musl or
  # aarch64 break shows up before anything is tagged.
  musl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

  # The real binary against a real container engine (docker and its compose
  # plugin come with the runner). Runs in parallel with `check`. Locally:
  # `make integration`.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Host tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf tmux
      - name: Integration tests
        run: make integration

  # Releases come from conventional commits, via release-please
  # (.github/release-please/: config.json, and manifest.json, which holds the
  # current version and is updated by the release PR). On every push
  # to master that passes the gates, it keeps a "release PR" open that bumps the
  # version in Cargo.toml: `feat` the minor version, `fix` the patch, a breaking
  # change the minor before 1.0. Merging that PR tags the version and creates a
  # *draft* GitHub release; `upload` attaches the binaries and `publish` makes
  # it public, so `releases/latest` (what install.sh downloads) never points at
  # a release without assets. No changelog file is kept; the release notes are
  # generated from the commits.
  release:
    needs: [check, msrv, deny, musl, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      # Empty unless a new version was released by this run.
      tag: ${{ steps.release.outputs.release_created && steps.release.outputs.tag_name || '' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # Build static musl binaries for x86_64 and aarch64 and attach them as
  # .tar.gz assets to the draft release.
  upload:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      # Generated by the host build (the target may be another architecture);
      # they do not depend on it.
      - name: Generate completions and man page
        run: |
          mkdir dist
          cargo run --quiet -- completions bash > dist/ldg.bash
          cargo run --quiet -- completions zsh > dist/_ldg
          cargo run --quiet -- completions fish > dist/ldg.fish
          cargo run --quiet -- man > dist/ldg.1
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ldg
          target: ${{ matrix.target }}
          archive: ldg-$target
          include: dist/ldg.bash,dist/_ldg,dist/ldg.fish,dist/ldg.1
          ref: refs/tags/${{ needs.release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish the draft once every asset is attached.
  publish:
    needs: [release, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
