[package]
name = "lodge-cli"
version = "0.4.2"
edition = "2024"
# File::try_lock (forward daemon) needs 1.89. CI checks this version builds.
rust-version = "1.89"
description = "Inject your environment into any container; a lightweight devcontainer runner."
license = "MIT"
readme = "README.md"
keywords = ["devcontainer", "docker", "container", "patchelf"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ldg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json_comments = "0.2"
toml = "0.8"
anyhow = "1"
dirs = "5"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
schemars = "1"
